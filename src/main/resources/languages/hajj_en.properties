# Step details
step.0.details=Ihram is the intention to enter the state of pilgrimage. The pilgrim performs ghusl, applies perfume, and wears the Ihram garments. They then make the intention for Hajj and say: "Labbayk Allahumma Hajjan."
step.1.details=Miqat is the designated place from which the pilgrim must enter the state of Ihram. It is not permitted to pass it without Ihram for anyone intending Hajj.
step.2.details=The pilgrim enters Makkah while reciting the Talbiyah, enters the Sacred Mosque with the right foot, and recites the supplication for entering the mosque.
step.3.details=Tawaf al-Qudum is recommended for those arriving in Makkah. The pilgrim circumambulates the Kaaba seven times with the intention of arrival.
step.4.details=After completing seven rounds, the pilgrim proceeds to the Station of Ibrahim to perform two rak'ahs of the Tawaf prayer.
step.5.details=The pilgrim prays two rak'ahs behind the Station of Ibrahim if possible.
step.6.details=After the prayer, the pilgrim returns to the Black Stone and touches it if able, or points to it with their hand.
step.7.details=Sa'i begins at Safa and ends at Marwah, completing seven rounds.
step.8.details=In Hajj Tamattu, after the Sa'i the pilgrim shaves or trims their hair to exit the state of Umrah.
step.9.details=On the 8th of Dhul-Hijjah, the pilgrim enters the state of Ihram for Hajj from their place and heads to Mina.
step.10.details=The pilgrim heads to Mina and stays there for the night of the 9th, praying Dhuhr, Asr, Maghrib, Isha, and Fajr in shortened form.
step.11.details=The 9th of Dhul-Hijjah is the greatest day of Hajj. The pilgrim heads to Arafah after sunrise.
step.12.details=Standing at Arafah is a pillar of Hajj. The pilgrim stands from the sun's zenith until sunset, supplicating and remembering Allah.
step.13.details=The pilgrim engages in extensive supplication, remembrance, Talbiyah, and seeking forgiveness. The best supplication is the supplication of the Day of Arafah.
step.14.details=After sunset on the Day of Arafah, the pilgrim heads to Muzdalifah with calmness and dignity.
step.15.details=The 10th of Dhul-Hijjah is the Day of Eid and the Day of Sacrifice. On this day, the pilgrim throws stones at Jamrat al-Aqabah and slaughters the sacrifice.
step.16.details=The pilgrim arrives at Mina on the morning of Eid to perform the rites of the Day of Sacrifice.
step.17.details=Slaughtering the sacrifice is obligatory for those performing Tamattu and Qiran. It takes place on the Day of Sacrifice and the days of Tashriq.
step.18.details=After throwing the stones and slaughtering, the pilgrim shaves their head or trims it. Shaving is preferred.
step.19.details=After throwing, slaughtering, and shaving, the first state of release is achieved. Everything becomes permissible for the pilgrim except marital relations.
step.20.details=Tawaf al-Ifadah is a pillar of Hajj. The pilgrim circumambulates the Kaaba seven times.
step.21.details=The pilgrim prays two rak'ahs behind the Station of Ibrahim after completing the Tawaf.
step.22.details=The pilgrim performs Sa'i between Safa and Marwah seven rounds. It is a pillar for those performing Tamattu.
step.23.details=The pilgrim returns to Mina to spend the nights of Tashriq and throw stones at the three Jamarat.
step.24.details=Slaughtering the sacrifice is obligatory for those performing Tamattu and Qiran. If unable, they fast for ten days.
step.25.details=It is recommended for the pilgrim to engage in extensive worship, remembrance, and supplication during these blessed days.
step.26.details=Tawaf al-Wada is the final rite of Hajj. The pilgrim circumambulates the Kaaba seven times before leaving Makkah.
step.27.details=It is recommended for the pilgrim, after completing Hajj, to visit the Prophet's Mosque in Madinah.
step.28.details=It is recommended to visit Al-Baqi cemetery, where many companions are buried, and to visit Quba Mosque, the first mosque built in Islam.
step.29.details=It is recommended to visit the martyrs of Uhud and supplicate for them.
step.30.details=Prayer at Quba Mosque carries great reward ? it is reported to be equivalent to an Umrah.
step.31.details=Upon returning home, the pilgrim recites the prescribed supplications and asks Allah for acceptance and steadfastness.