# Step details
step.0.details=الإحرام هو نية الدخول في النسك. يغتسل الحاج ويتطيب ويلبس ثياب الإحرام، وينوي الحج ويقول: لبيك اللهم حجاً.
step.1.details=الميقات هو المكان الذي يحرم منه الحاج. لا يجوز تجاوزه بدون إحرام لمن أراد الحج.
step.2.details=يدخل الحاج مكة ملبياً ويدخل المسجد الحرام برجله اليمنى ويقول دعاء دخول المسجد.
step.3.details=طواف القدوم سنة للقادم إلى مكة، يطوف سبعة أشواط حول الكعبة بنية القدوم.
step.4.details=بعد إتمام سبعة أشواط، يتوجه إلى مقام إبراهيم عليه السلام لأداء ركعتي الطواف.
step.5.details=يصلي ركعتين خلف مقام إبراهيم عليه السلام إن تيسر.
step.6.details=بعد الصلاة يعود إلى الحجر الأسود ويستلمه إن استطاع، أو يشير إليه بيده.
step.7.details=يبدأ السعي من الصفا ويختم بالمروة، سبعة أشواط.
step.8.details=في الحج التمتع، بعد السعي يحلق أو يقصر للتحلل من العمرة.
step.9.details=اليوم الثامن من ذي الحجة، يحرم الحاج بالحج من مكانه ويتجه إلى منى.
step.10.details=يتوجه الحاج إلى منى ويبيت فيها ليلة التاسع، يصلي الظهر والعصر والمغرب والعشاء والفجر قصراً.
step.11.details=اليوم التاسع من ذي الحجة، أعظم أيام الحج، يتوجه الحاج فيه إلى عرفة بعد طلوع الشمس.
step.12.details=الوقوف بعرفة ركن من أركان الحج، يقف الحاج من زوال الشمس إلى غروبها داعياً ذاكراً.
step.13.details=يكثر من الدعاء والذكر والتلبية والاستغفار، وأفضل الدعاء دعاء يوم عرفة.
step.14.details=بعد غروب شمس يوم عرفة، يتوجه الحاج إلى مزدلفة بسكينة ووقار.
step.15.details=اليوم العاشر من ذي الحجة، يوم العيد ويوم النحر، فيه يرمي جمرة العقبة وينحر هديه.
step.16.details=يصل الحاج إلى منى صباح يوم العيد لأداء أعمال يوم النحر.
step.17.details=نحر الهدي واجب على المتمتع والقارن، يكون يوم النحر وأيام التشريق.
step.18.details=بعد رمي الجمرة ونحر الهدي، يحلق الحاج رأسه أو يقصر، والحلق أفضل.
step.19.details=بعد الرمي والنحر والحلق يحصل التحلل الأول، فيحل للحاج كل شيء إلا النساء.
step.20.details=طواف الإفاضة ركن من أركان الحج، يطوف الحاج سبعة أشواط حول الكعبة.
step.21.details=يصلي ركعتين خلف مقام إبراهيم عليه السلام بعد الانتهاء من الطواف.
step.22.details=يسعى الحاج بين الصفا والمروة سبعة أشواط، وهو ركن للمتمتع.
step.23.details=يرجع الحاج إلى منى ليبيت فيها ليالي التشريق ويرمي الجمرات الثلاث.
step.24.details=على المتمتع والقارن ذبح هدي وجوباً، فإن لم يجد صام عشرة أيام.
step.25.details=يستحب للحاج الإكثار من الطاعات والذكر والدعاء في هذه الأيام المباركة.
step.26.details=طواف الوداع آخر أعمال الحج، يطوف الحاج سبعة أشواط قبل مغادرة مكة.
step.27.details=يستحب للحاج بعد انتهاء الحج زيارة مسجد النبي صلى الله عليه وسلم في المدينة.
step.28.details=يستحب زيارة البقيع حيث دفن كثير من الصحابة، وزيارة مسجد قباء أول مسجد بني في الإسلام.
step.29.details=يستحب زيارة شهداء أحد والدعاء لهم رضي الله عنهم.
step.30.details=الصلاة في مسجد قباء لها فضل عظيم، وقد ورد أنها تعدل عمرة.
step.31.details=عند عودته إلى بلاده يقول الأذكار المأثورة، ويسأل الله القبول والثبات.