# Umrah — Arabic
# Step names
step.0.name=الإحرام
step.1.name=الميقات
step.2.name=عند دخول مكة وبعد دخول المسجد الحرام
step.3.name=الطواف
step.4.name=الفراغ من الطواف
step.5.name=الصلاة عند مقام إبراهيم عليه السلام
step.6.name=استلام الحجر الأسود
step.7.name=السعي بين الصفا والمروة
step.8.name=الحلق و التقصير

# Step details
step.0.details=الإحرام هو نية الدخول في النسك. يغتسل المعتمر ويتطيب ويلبس ثياب الإحرام (إزار ورداء أبيضين للرجل)، ثم ينوي العمرة ويقول: لبيك اللهم عمرة.
step.1.details=الميقات هو المكان الذي يحرم منه الحاج أو المعتمر. لا يجوز تجاوزه بدون إحرام لمن أراد العمرة أو الحج.
step.2.details=يدخل المعتمر مكة ملبياً، ويدخل المسجد الحرام برجله اليمنى ويقول دعاء دخول المسجد. عند رؤية الكعبة يرفع يديه ويدعو بما شاء.
step.3.details=يبدأ الطواف من الحجر الأسود ويجعل الكعبة عن يساره، ويطوف سبعة أشواط حول الكعبة. يستحب الرمل في الأشواط الثلاثة الأولى للرجال.
step.4.details=بعد إتمام سبعة أشواط، يتوجه إلى مقام إبراهيم عليه السلام لأداء ركعتي الطواف.
step.5.details=يصلي ركعتين خلف مقام إبراهيم عليه السلام إن تيسر، يقرأ في الأولى سورة الكافرون وفي الثانية سورة الإخلاص.
step.6.details=بعد الصلاة يعود إلى الحجر الأسود ويستلمه إن استطاع، أو يشير إليه بيده.
step.7.details=يبدأ السعي من الصفا ويختم بالمروة، سبعة أشواط، ويدعو الله بما شاء بين الشوطين.
step.8.details=بعد إتمام السعي يحلق المعتمر شعره أو يقصر منه، والحلق أفضل، وبذلك يتحلل من إحرامه وتنتهي العمرة.