# Umrah ? English
# Step names
step.0.name=Ihram
step.1.name=Miqat
step.2.name=Entering Makkah and the Sacred Mosque
step.3.name=Tawaf
step.4.name=After Completing Tawaf
step.5.name=Prayer at the Station of Ibrahim
step.6.name=Touching the Black Stone
step.7.name=Sa'i between Safa and Marwah
step.8.name=Shaving or Trimming the Hair

# Step details
step.0.details=Ihram is the intention to enter the state of pilgrimage. The pilgrim performs ghusl, applies perfume, and wears the Ihram garments (two white seamless cloths for men). They then make the intention for Umrah and say: "Labbayk Allahumma Umrah."
step.1.details=Miqat is the designated place from which the Hajj or Umrah pilgrim must enter the state of Ihram. It is not permitted to pass it without Ihram for anyone intending Umrah or Hajj.
step.2.details=The pilgrim enters Makkah while reciting the Talbiyah, and enters the Sacred Mosque with the right foot while reciting the supplication for entering the mosque. Upon seeing the Kaaba, they raise their hands and supplicate as they wish.
step.3.details=Tawaf begins at the Black Stone with the Kaaba on the left side. The pilgrim circumambulates the Kaaba seven times. It is recommended for men to walk briskly (Raml) in the first three rounds.
step.4.details=After completing the seven rounds, the pilgrim proceeds to the Station of Ibrahim (Maqam Ibrahim) to perform two rak'ahs of the Tawaf prayer.
step.5.details=The pilgrim prays two rak'ahs behind the Station of Ibrahim if possible, reciting Surah Al-Kafirun in the first rak'ah and Surah Al-Ikhlas in the second.
step.6.details=After the prayer, the pilgrim returns to the Black Stone and touches it if able, or points to it with their hand.
step.7.details=Sa'i begins at Safa and ends at Marwah, completing seven rounds. The pilgrim supplicates to Allah as they wish during the rounds.
step.8.details=After completing the Sa'i, the pilgrim shaves their head or trims their hair ? shaving is preferred ? thereby exiting the state of Ihram and completing the Umrah.